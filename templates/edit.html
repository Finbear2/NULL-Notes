<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.name[:-3] }}</title>

    {% include "imports.html" %}

    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <div class="background" style="left: 244px; width: calc(100vw - 244px);">
        <div class="column">
            <div class="topbar" style="z-index: 5;">
                <div class="row">
                    <button class="topbar-button" onclick="window.location.href='/{{ user.name }}/preview/{{ noteName }}'">Preview</button>
                    <form method="post">
                        <input type="hidden" name="formType" value="delete">
                        <button class="topbar-button" type="submit">Delete</button>
                    </form>
                </div>
            </div>
            <form method="post">  
                <textarea id="text" name="text" spellcheck="true" style="max-height: calc(100vh - 50px);">{{ note.text }}</textarea>  
            </form>
        </div>
    </div>

    {% if result %}
        <div class="center-horizontal">
            <div class="Popup" style=" position: relative; top: 300px; ">
                <div class="card">
                    <div class="column" style="gap: 30px;">
                        <h1>Are you sure you<br/>want to <span style="color: var(--red-500); text-shadow: var(--light-shadow) 0px 5px 5px;">delete</span> this file?</h1>
                        <div class="row" style="gap: 15px;">
                            <form method="post">
                                <input type="hidden" name="formType" value="yes">
                                <button class="warning-button">Yes</button>
                            </form>
                            <form method="post">
                                <input type="hidden" name="formType" value="no">
                                <button class="primary-button">No</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    {% endif %}

    {% include "sidebar.html" %}
</body>
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/edit.js') }}"></script>
</html>
