<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ word.name }}</title>

    {% include "imports.html" %}

</head>
<body>
    <div class="background" style="left: 244px; width: calc(100vw - 244px);">

            </div>
        </div>
    </div>
    
    {% include "sidebar.html" %}
</body>
</html>
